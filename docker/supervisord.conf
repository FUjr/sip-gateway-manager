[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/gateway/supervisor.pid
[program:internal]
command=/opt/venv/bin/uvicorn backend.main:internal --uds /run/gateway/ingest.sock
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:asterisk]
command=/usr/sbin/asterisk -f -U asterisk -G asterisk
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:backend]
command=/opt/venv/bin/uvicorn backend.main:app --host 0.0.0.0 --port 8000
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
