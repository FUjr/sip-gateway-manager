server {
    listen 8443 ssl;
    ssl_certificate /certs/fullchain.pem;
    ssl_certificate_key /certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    client_max_body_size 64k;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    location /api/v1/linphone/ { access_log off; proxy_pass http://pbx:8000; proxy_set_header Host $host; }
    location /api/ { proxy_pass http://pbx:8000; proxy_set_header Host $host; }
    location / { try_files $uri /index.html; }
}
